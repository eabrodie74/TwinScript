name: Check language data
on:
  pull_request:
    branches: [language-data]
  push:
    branches: [language-data]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 validate.py
